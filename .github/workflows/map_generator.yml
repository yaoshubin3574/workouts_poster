name: Workouts Poster Generator

on:
  workflow_dispatch:
    inputs:
      preset:
        description: '预设城市'
        required: true
        type: choice
        default: 'ALL CITIES'
        options:
          - 'ALL CITIES'
          - 'CUSTOM'
          - 'HANGZHOU'
          - 'HENAN'
          - 'JIAOZUO'
          - 'JINHUA'
          - 'NINGBO'
          - 'TAIZHOU-HUIXI'
          - 'TAIZHOU-MIAOYANG'
          - 'XINXIANG'
      city:
        description: '城市 '
        required: false
        default: ''
      lat:
        description: '中心点纬度 '
        required: false
        default: ''
      lon:
        description: '中心点经度 '
        required: false
        default: ''
      distance:
        description: '距离/米 '
        required: false
        default: ''

jobs:
  build_map:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: 获取仓库代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 解析运行参数与构建目标
      run: |
        python - << 'EOF'
        import os, json

        preset = "${{ github.event.inputs.preset }}".strip()
        custom_city = "${{ github.event.inputs.city }}".strip()
        custom_lat = "${{ github.event.inputs.lat }}".strip()
        custom_lon = "${{ github.event.inputs.lon }}".strip()
        custom_dist = "${{ github.event.inputs.distance }}".strip()

        # 按字母 A-Z 严格排序的预设数据列表
        presets = {
            'HANGZHOU':     {'city': 'HANGZHOU',     'title': 'HANGZHOU', 'distance': '4600',  'lon': '120.1390416', 'lat': '30.2250866'},
            'HENAN':         {'city': 'HENAN',        'title': 'HENAN',    'distance': '65000', 'lon': '113.6178735', 'lat': '35.1197434'},
            'JIAOZUO':       {'city': 'JIAOZUO',      'title': 'JIAOZUO',  'distance': '13000', 'lon': '113.2526282', 'lat': '35.1946971'},
            'JINHUA':       {'city': 'JINHUA',       'title': 'JINHUA',   'distance': '6600',  'lon': '119.5345237', 'lat': '29.1160378'},
            'NINGBO':         {'city': 'NINGBO',       'title': 'NINGBO',   'distance': '8000',  'lon': '121.4667517', 'lat': '29.5165939'},
            'TAIZHOU-HUIXI': {'city': 'TAIZHOU-HUIXI', 'title': 'TAIZHOU', 'distance': '2000',  'lon': '121.2217447', 'lat': '28.9567779'},
            'TAIZHOU-MIAOYANG': {'city': 'TAIZHOU-MIAOYANG', 'title': 'TAIZHOU', 'distance': '2200',  'lon': '121.2226776', 'lat': '28.9160953'},
            'XINXIANG':      {'city': 'XINXIANG',     'title': 'XINXIANG', 'distance': '20000', 'lon': '113.9313797', 'lat': '35.2856284'},
        }

        if preset.startswith('ALL CITIES'):
            targets = list(presets.values())
            pkg_name = "ALL_CITIES_Workouts_Poster"
            print(f"模式：ALL CITIES，将批量生成全部 {len(targets)} 个预设城市的海报！")
        elif preset in presets and not preset.startswith('CUSTOM'):
            data = presets[preset]
            city = custom_city if custom_city else data['city']
            title = data.get('title', city)
            lat = custom_lat if custom_lat else data['lat']
            lon = custom_lon if custom_lon else data['lon']
            dist = custom_dist if custom_dist else data['distance']
            targets = [{'city': city, 'title': title, 'distance': dist, 'lon': lon, 'lat': lat}]
            pkg_name = f"{city}_Workouts_Poster"
            print(f"采用预设配置 [{preset}]: 城市={city}, 纬度={lat}, 经度={lon}, 范围={dist}米")
        else:
            if not (custom_city and custom_lat and custom_lon and custom_dist):
                raise ValueError("选择 CUSTOM 模式时，必须完整填写 city, lat, lon, distance 四个参数！")
            targets = [{'city': custom_city, 'title': custom_city, 'distance': custom_dist, 'lon': custom_lon, 'lat': custom_lat}]
            pkg_name = f"{custom_city}_Workouts_Poster"
            print(f"采用自定义配置: 城市={custom_city}, 纬度={custom_lat}, 经度={custom_lon}, 范围={custom_dist}米")

        with open('targets.json', 'w', encoding='utf-8') as f:
            json.dump(targets, f, ensure_ascii=False, indent=2)

        env_file = os.getenv('GITHUB_ENV')
        with open(env_file, 'a', encoding='utf-8') as f:
            f.write(f"PACKAGE_NAME={pkg_name}\n")
        EOF

    - name: 安装依赖与 Inkscape
      run: |
        python -m pip install --upgrade pip
        pip install Pillow terraink-py
        sudo apt-get update
        sudo apt-get install -y inkscape

    - name: 生成海报并渲染 300PPI PNG
      run: |
        python - << 'EOF'
        import json, subprocess, sys
        from pathlib import Path

        # 1. 预先从 workouts_page 下载全量最新运动数据
        activities_file = Path("activities.json")
        data_url = "https://raw.githubusercontent.com/yaoshubin3574/workouts_page/master/src/static/activities.json"
        print(f"📥 正在从 workouts_page 下载最新运动轨迹数据: {data_url}")
        subprocess.run(["curl", "-sSL", "-o", str(activities_file), data_url], check=True)
        print(f"✅ 运动数据下载完成: {activities_file} ({activities_file.stat().st_size / 1024:.1f} KB)\n")

        with open('targets.json', 'r', encoding='utf-8') as f:
            targets = json.load(f)

        Path("output").mkdir(parents=True, exist_ok=True)

        for idx, item in enumerate(targets, 1):
            city = item['city']
            title = item.get('title', city)
            lat = item['lat']
            lon = item['lon']
            dist = item['distance']
            svg_path = f"output/{city}_Workouts_Poster.svg"
            png_path = f"output/{city}_Workouts_Poster.png"

            print(f"\n==================================================")
            print(f"[{idx}/{len(targets)}] 正在处理: {city} (标题: {title}, 半径: {dist}m)...")
            print(f"==================================================")

            # 2. 生成 SVG 矢量海报并注入 workouts_page 轨迹
            cmd_svg = [
                sys.executable, "generate_poster.py",
                "--lat", str(lat),
                "--lon", str(lon),
                "--distance", str(dist),
                "--city", str(city),
                "--title", str(title),
                "--output", svg_path,
                "--activities", str(activities_file)
            ]
            subprocess.run(cmd_svg, check=True)

            # 3. 调用 Inkscape 渲染 300 PPI PNG
            cmd_png = [
                "inkscape",
                "--export-type=png",
                f"--export-filename={png_path}",
                "--export-dpi=300",
                svg_path
            ]
            subprocess.run(cmd_png, check=True)
            print(f"✅ 成功完成: {png_path} (300 PPI) 和 {svg_path}")

        print("\n🎉 所有城市的海报生成与渲染已全部顺利完成！")
        EOF

    - name: 打包文件提供下载 (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGE_NAME }}
        path: output/
        if-no-files-found: error
        retention-days: 7

    - name: 发布 GitHub Release 并上传 PNG 附件
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG_NAME="${PACKAGE_NAME}_$(date +'%Y%m%d_%H%M%S')"
        gh release create "$TAG_NAME" output/*.png \
          --title "${PACKAGE_NAME}" \
          --notes "Workouts Poster (300 PPI PNG) - generated at $(date +'%Y-%m-%d %H:%M:%S UTC')"
