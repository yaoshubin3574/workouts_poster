name: Workouts Poster Generator

on:
  workflow_dispatch:
    inputs:
      preset:
        description: '📍 预设城市'
        required: true
        type: choice
        default: 'HANGZHOU (4.6km)'
        options:
          - 'CUSTOM'
          - 'HANGZHOU (4.6km)'
          - 'HENAN (65km)'
          - 'JIAOZUO (13km)'
          - 'JINHUA (6.6km)'
          - 'NINGBO (8km)'
          - 'TAIZHOU-2000 (2.0km)'
          - 'TAIZHOU-2200 (2.2km)'
          - 'XINXIANG (20km)'
      generate_svg:
        description: '生成 SVG 文件'
        required: false
        type: boolean
        default: false
      city:
        description: '城市'
        required: false
        default: ''
      lat:
        description: '中心点纬度'
        required: false
        default: ''
      lon:
        description: '中心点经度'
        required: false
        default: ''
      distance:
        description: '距离/m'
        required: false
        default: ''

jobs:
  build_map:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: 获取仓库代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 解析运行参数
      run: |
        python - << 'EOF'
        import os

        preset = "${{ github.event.inputs.preset }}".strip()
        custom_city = "${{ github.event.inputs.city }}".strip()
        custom_lat = "${{ github.event.inputs.lat }}".strip()
        custom_lon = "${{ github.event.inputs.lon }}".strip()
        custom_dist = "${{ github.event.inputs.distance }}".strip()

        # 按城市字母 A-Z 严格排序的预设数据
        presets = {
            'HANGZHOU (4.6km)':     {'city': 'HANGZHOU', 'distance': '4600',  'lon': '120.1390416', 'lat': '30.2250866'},
            'HENAN (65km)':         {'city': 'HENAN',    'distance': '65000', 'lon': '113.6178735', 'lat': '35.1197434'},
            'JIAOZUO (13km)':       {'city': 'JIAOZUO',  'distance': '13000', 'lon': '113.2526282', 'lat': '35.1946971'},
            'JINHUA (6.6km)':       {'city': 'JINHUA',   'distance': '6600',  'lon': '119.5345237', 'lat': '29.1160378'},
            'NINGBO (8km)':         {'city': 'NINGBO',   'distance': '8000',  'lon': '121.4667517', 'lat': '29.5165939'},
            'TAIZHOU-2000 (2.0km)': {'city': 'TAIZHOU',  'distance': '2000',  'lon': '121.2217447', 'lat': '28.9567779'},
            'TAIZHOU-2200 (2.2km)': {'city': 'TAIZHOU',  'distance': '2200',  'lon': '121.2226776', 'lat': '28.9152824'},
            'XINXIANG (20km)':      {'city': 'XINXIANG', 'distance': '20000', 'lon': '113.9313797', 'lat': '35.2856284'},
        }

        if preset in presets and not preset.startswith('CUSTOM'):
            data = presets[preset]
            city = custom_city if custom_city else data['city']
            lat = custom_lat if custom_lat else data['lat']
            lon = custom_lon if custom_lon else data['lon']
            dist = custom_dist if custom_dist else data['distance']
            print(f"👉 采用预设配置 [{preset}]: 城市={city}, 纬度={lat}, 经度={lon}, 范围={dist}米")
        else:
            if not (custom_city and custom_lat and custom_lon and custom_dist):
                raise ValueError("❌ 选择 CUSTOM 模式时，必须完整填写 city, lat, lon, distance 四个参数！")
            city, lat, lon, dist = custom_city, custom_lat, custom_lon, custom_dist
            print(f"👉 采用自定义配置: 城市={city}, 纬度={lat}, 经度={lon}, 范围={dist}米")

        # 写入环境变量
        env_file = os.getenv('GITHUB_ENV')
        with open(env_file, 'a', encoding='utf-8') as f:
            f.write(f"CITY={city}\n")
            f.write(f"LAT={lat}\n")
            f.write(f"LON={lon}\n")
            f.write(f"DISTANCE={dist}\n")
        EOF

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install Pillow terraink-py

    - name: 生成基础海报与轨迹
      run: |
        python generate_poster.py \
          --lat $LAT \
          --lon $LON \
          --distance $DISTANCE \
          --city "$CITY"

    - name: 渲染 PNG 图片 (1080x1528)
      run: |
        sudo apt-get update
        sudo apt-get install -y inkscape
        inkscape --export-width=1080 --export-height=1528 --export-type=png --export-filename=Workouts_Poster.png Workouts_Poster.svg

    - name: 整理输出文件
      run: |
        mkdir -p output
        cp Workouts_Poster.png "output/${CITY}_Workouts_Poster.png"
        if [ "${{ github.event.inputs.generate_svg }}" = "true" ]; then
          cp Workouts_Poster.svg "output/${CITY}_Workouts_Poster.svg"
          echo "✅ 已包含 SVG 矢量文件"
        else
          echo "ℹ️ 未勾选生成 SVG，仅保留 PNG 图片"
        fi

    - name: 打包发布提供下载
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.CITY }}_Workouts_Poster
        path: output/
        if-no-files-found: error
        retention-days: 7